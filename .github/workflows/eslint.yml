name: ESLint CI

x-paths-ignore: &paths-ignore
  - '**.md'
  - '.github/**'
  - '.env.example'
  - '.gitignore'
  - '.dockerignore'
  - 'Dockerfile'

on:
  push:
    branches:
      - 'main'
      - 'dev'
      - 'feature-**'
      - 'feature/**'
    paths-ignore: *paths-ignore
  pull_request:
    branches:
      - '*'
    paths-ignore: *paths-ignore
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install modules
        run: yarn install

      - name: Install ESLint
        run: yarn add eslint

      - name: Run ESLint
        run: npx eslint . --ext .js,.jsx,.ts,.tsx